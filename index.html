<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Página Full Screen 9:16</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        /* EL TRUCO: El contenedor ocupa TODO el móvil, pero mantiene la lógica 9:16 para los botones */
        .main-wrapper {
            position: relative;
            width: 100%;
            height: 100dvh;
            max-width: 56.25vh; /* Esto equivale a 9/16 de la altura total */
            background-image: url('tu-imagen.jpg'); /* REEMPLAZAR AQUÍ */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
        }

        /* Ajuste para que en celulares se vea realmente Full Screen sin bordes */
        @media (max-aspect-ratio: 9/16) {
            .main-wrapper {
                max-width: 100vw;
            }
        }

        .boton-menu {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            padding: 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Ubicaciones exactas en la imagen */
        .btn-1 { top: 40%; }
        .btn-2 { top: 52%; }
        .btn-3 { top: 64%; }

        /* Contenido lateral solo para PC */
        .lateral {
            display: none;
            position: absolute;
            color: #444;
            font-size: 0.8rem;
            width: 200px;
        }

        @media (min-width: 1024px) {
            .lateral { display: block; }
            .lat-izq { left: 5%; text-align: right; }
            .lat-der { right: 5%; text-align: left; }
        }
    </style>
</head>
<body>

    <div class="lateral lat-izq">Experiencia Vertical v1.0<br>Diseño Optimizado</div>

    <div class="main-wrapper">
        <button class="boton-menu btn-1">Comenzar</button>
        <button class="boton-menu btn-2">Galería Pro</button>
        <button class="boton-menu btn-3">Contacto</button>
    </div>

    <div class="lateral lat-der">Desliza para explorar<br>© 2024 Tu Marca</div>

</body>
</html>
